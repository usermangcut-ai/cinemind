<title>CineMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: một rạp chiếu tối — landing kể chuyện, app 3 cột (lịch sử | chat | top 10), poster vẽ bằng CSS */
:root {
  --bg: #110d13; --panel: #18131b; --panel-2: #211a25; --line: #30273a;
  --fg: #f4ede4; --muted: #a497a6; --dim: #6f6373;
  --accent: #f2a14a; --accent-ink: #1d1206; --accent-soft: rgba(242,161,74,.14);
  --good: #86cfa8; --danger: #ef7a6c;
  --display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
  --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 12px; --top: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { line-height: 1.1; font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.02em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: transform .15s, background .15s, border-color .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: #f7b46a; }
.btn-ghost { border: 1px solid var(--line); color: var(--fg); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.icon-btn:hover { background: var(--panel-2); color: var(--fg); }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Poster vẽ bằng CSS ---------- */
.poster { container-type: inline-size; position: relative; aspect-ratio: 2/3; max-width: 100%; border-radius: 8px; overflow: hidden; flex: none;
  background: radial-gradient(circle at 72% 22%, hsl(var(--h) 85% 62% / .6), transparent 46%), linear-gradient(165deg, hsl(var(--h) 48% 32%), hsl(calc(var(--h) + 28) 42% 9%));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); color: #fff; display: block; }
.poster::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
.poster::after { content: ''; position: absolute; width: 62cqi; aspect-ratio: 1; right: -14cqi; top: 10cqi; border-radius: 50%; border: 1.5cqi solid hsl(var(--h) 90% 75% / .35); }
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.rank .poster img, .simitem .poster img { display: block; }
.poster .p-year { position: absolute; top: 8cqi; left: 9cqi; font: 500 clamp(7px, 7cqi, 13px) var(--mono); opacity: .75; }
.poster .p-cap { position: absolute; left: 9cqi; right: 9cqi; bottom: 9cqi; z-index: 1; display: grid; gap: 4cqi; }
.poster .p-title { font: 800 clamp(7px, var(--fs, 14cqi), 34px)/.95 var(--display); text-transform: uppercase; letter-spacing: -.02em; overflow-wrap: break-word; hyphens: auto; }
.poster .p-dir { font: 500 clamp(6px, 6.5cqi, 12px) var(--mono); opacity: .7; text-transform: uppercase; }

/* ---------- Views ---------- */
.view { min-height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); display: flex; align-items: center; gap: 12px; padding-inline: 16px; background: rgba(17,13,19,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 9px; font: 800 19px var(--display); letter-spacing: -.03em; color: var(--fg); }
.logo-mark { width: 26px; height: 26px; border-radius: 7px; background: conic-gradient(from 200deg, var(--accent), #e8576b, var(--accent)); display: grid; place-items: center; }
.logo-mark::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); }
.nav { display: flex; gap: 4px; margin-left: 12px; }
.nav button { padding: 7px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; font-size: 14px; }
.nav button.on { background: var(--panel-2); color: var(--fg); }
.count { font: 500 11px var(--mono); background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; margin-left: 4px; }
.spacer { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #e8576b); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* ---------- Landing ---------- */
#v-landing .topbar { background: transparent; border: 0; backdrop-filter: none; position: absolute; left: 0; right: 0; }
.hero { position: relative; overflow: hidden; padding: calc(var(--top) + 56px) 16px 0; }
.hero::before { content: ''; position: absolute; inset: -20% -10% auto; height: 620px; background: radial-gradient(ellipse at 30% 20%, rgba(242,161,74,.22), transparent 55%), radial-gradient(ellipse at 85% 10%, rgba(232,87,107,.16), transparent 50%); pointer-events: none; }
.hero-in { position: relative; max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
.hero h1 { font-size: clamp(40px, 6.2vw, 78px); line-height: .98; font-weight: 800; letter-spacing: -.045em; margin-top: 18px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p.lead { font-size: 18px; color: var(--muted); max-width: 520px; margin: 22px 0 28px; }
.ask { display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); max-width: 560px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.6); }
.ask input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 0 12px; font-size: 16px; }
.ask input::placeholder { color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 13px; transition: .15s; }
.chip:hover { border-color: var(--accent); color: var(--fg); }
.hero .chips { margin-top: 16px; max-width: 560px; }
.preview { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.8); transform: rotate(1.2deg); }
.preview .bubble-u { justify-self: end; }
.strip { margin-top: 72px; display: flex; gap: 14px; width: max-content; animation: marquee 70s linear infinite; padding-bottom: 8px; }
.strip .poster { width: 132px; opacity: .55; }
@keyframes marquee { to { transform: translateX(-50%); } }
.section { max-width: 1180px; margin: 0 auto; padding: 96px 16px 0; }
.section h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 800; margin: 14px 0 12px; max-width: 760px; }
.section > p { color: var(--muted); max-width: 620px; font-size: 17px; margin: 0; }
.steps-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-top: 40px; }
.step-card { background: var(--panel); padding: 28px; display: grid; gap: 10px; align-content: start; }
.feats { grid-template-columns: repeat(4, 1fr); }
.ic-sq { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.step-card .n { font: 500 13px var(--mono); color: var(--accent); }
.step-card h3 { font-size: 21px; }
.step-card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; margin-top: 40px; }
.feature-list { display: grid; gap: 18px; }
.feature { display: grid; grid-template-columns: 40px 1fr; gap: 14px; }
.feature .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.feature h3 { font-size: 17px; }
.feature p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.cta { margin: 110px auto 0; max-width: 1180px; padding: 0 16px 64px; }
.cta-in { border-radius: 24px; padding: 56px 32px; text-align: center; background: radial-gradient(ellipse at 50% 0%, rgba(242,161,74,.25), transparent 60%), var(--panel); border: 1px solid var(--line); display: grid; gap: 16px; justify-items: center; }
.cta-in h2 { font-size: clamp(30px, 4.4vw, 52px); font-weight: 800; }
.cta-in p { color: var(--muted); margin: 0; }
footer { text-align: center; color: var(--dim); font-size: 13px; padding: 0 16px 40px; }

/* ---------- Similarity bars ---------- */
.sim { display: grid; gap: 7px; }
.sim-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sim-score { font: 700 26px var(--display); color: var(--accent); }
.sim-row { display: grid; grid-template-columns: 74px 1fr 34px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #e8576b, var(--accent)); }
.sim-row b { font: 500 12px var(--mono); color: var(--fg); text-align: right; }
.sim-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 18px; }
.pair { display: flex; align-items: center; gap: 14px; }
.pair .poster { width: 78px; }
.pair .vs { font: 500 12px var(--mono); color: var(--dim); }

/* ---------- App ---------- */
#v-app { height: 100%; display: flex; flex-direction: column; }
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr) 300px; transition: grid-template-columns .25s; }
.app.l-off { grid-template-columns: 0 minmax(0, 1fr) 300px; }
.app.r-off { grid-template-columns: 264px minmax(0, 1fr) 0; }
.app.l-off.r-off { grid-template-columns: 0 minmax(0, 1fr) 0; }
.side { min-height: 0; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
.side-l { border-right: 1px solid var(--line); }
.side-r { border-left: 1px solid var(--line); }
.l-off .side-l, .r-off .side-r { border: 0; }
.side-in { width: 264px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.side-r .side-in { width: 300px; }
.side-head { padding: 14px; display: flex; align-items: center; gap: 8px; }
.side-title { font: 700 15px var(--display); flex: 1; }
.side-scroll { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
.group-label { font: 500 11px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .1em; padding: 14px 8px 6px; }
.conv-row { position: relative; display: flex; align-items: center; border-radius: 9px; }
.conv-row:hover, .conv-row:focus-within { background: var(--panel-2); }
.conv-row .conv { padding-right: 64px; }
.conv-acts { position: absolute; right: 4px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.conv-row:hover .conv-acts, .conv-row:focus-within .conv-acts, .conv-row.on .conv-acts { opacity: 1; }
@media (hover: none) { .conv-acts { opacity: 1; } }
.conv-acts .icon-btn { width: 28px; height: 28px; border-radius: 7px; }
.conv-acts .icon-btn svg.i { width: 15px; height: 15px; }
.conv-acts .del:hover { color: var(--danger); }
.conv-edit { display: flex; gap: 6px; padding: 4px; }
.conv-edit input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 9px; font-size: 13.5px; outline: 0; }
.conv-confirm { padding: 9px 10px; border-radius: 9px; background: rgba(239,122,108,.1); border: 1px solid rgba(239,122,108,.3); display: grid; gap: 8px; font-size: 13px; }
.conv-confirm .row { display: flex; gap: 6px; }
.btn-danger { background: var(--danger); color: #210806; }
.u-row { justify-self: end; display: flex; align-items: center; gap: 6px; max-width: 80%; }
.u-row .bubble-u { max-width: 100%; }
.u-row .icon-btn { opacity: 0; width: 30px; height: 30px; }
.u-row:hover .icon-btn, .u-row:focus-within .icon-btn { opacity: 1; }
@media (hover: none) { .u-row .icon-btn { opacity: 1; } }
.u-edit { justify-self: end; width: min(560px, 100%); display: grid; gap: 8px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 16px; padding: 10px; }
.u-edit textarea { background: none; border: 0; outline: 0; resize: vertical; min-height: 60px; font-size: 15px; }
.u-edit .row { display: flex; justify-content: flex-end; gap: 6px; }
.conv { width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; color: var(--muted); font-size: 13.5px; display: flex; gap: 9px; align-items: center; }
.conv span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.conv:hover { color: var(--fg); }
.conv-row.on { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.conv-row.on .conv { color: var(--fg); }
.tabs { display: flex; background: var(--bg); border-radius: 999px; padding: 3px; margin: 0 14px 6px; }
.tabs button { flex: 1; padding: 6px; border-radius: 999px; font-size: 13px; color: var(--muted); font-weight: 500; }
.tabs button.on { background: var(--panel-2); color: var(--fg); }
.rank { width: 100%; display: grid; grid-template-columns: 28px 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; text-align: left; }
.rank:hover { background: var(--panel-2); }
.rank .no { font: 800 22px var(--display); color: var(--dim); text-align: center; }
.rank:nth-child(-n+3) .no { color: var(--accent); }
.rank .poster { width: 40px; border-radius: 5px; }
.rank .poster * { display: none; }
.rank .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .m { font: 400 11.5px var(--mono); color: var(--dim); }
.side-note { font-size: 12px; color: var(--dim); padding: 4px 14px 14px; }

.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.chat-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.chat-bar .ttl { flex: 1; text-align: center; font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msgs { flex: 1; overflow-y: auto; padding: 28px 16px 20px; }
.msgs-in { max-width: 860px; margin: 0 auto; display: grid; gap: 26px; }
.bubble-u { justify-self: end; max-width: 80%; background: var(--panel-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 18px 18px 4px 18px; }
.ai { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.ai-av { width: 30px; height: 30px; border-radius: 9px; background: conic-gradient(from 200deg, var(--accent), #e8576b, var(--accent)); display: grid; place-items: center; }
.ai-av::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); }
.ai-body { display: grid; gap: 14px; min-width: 0; }
.ai-text { margin: 0; }
.ai-text b { color: var(--fg); font-weight: 700; }
.think { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 13px; }
.think summary { list-style: none; cursor: pointer; padding: 9px 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.think summary::-webkit-details-marker { display: none; }
.think ol { list-style: none; margin: 0; padding: 0 13px 11px; display: grid; gap: 7px; }
.think li { display: flex; gap: 9px; align-items: center; color: var(--dim); }
.think li.done { color: var(--muted); }
.think li.now { color: var(--fg); }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.done .dot { background: var(--good); border-color: var(--good); }
.done .dot::after { content: ''; width: 6px; height: 3px; border: solid var(--bg); border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg) translate(1px, -1px); }
.now .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.mcard { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; animation: rise .45s both; }
.mcard:hover { border-color: #463a4f; }
.mcard .poster { width: 96px; }
.mcard-b { display: grid; gap: 6px; align-content: start; min-width: 0; }
.mcard h3 { font-size: 17px; line-height: 1.2; }
.meta { font: 400 11.5px/1.4 var(--mono); color: var(--dim); }
.meta .star { color: var(--accent); }
.ov { font-size: 13px; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.why { font-size: 12.5px; background: var(--accent-soft); border-radius: 8px; padding: 6px 9px; color: #f6d2a8; }
.why strong { color: var(--accent); font-weight: 600; }
.mini-sim { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--accent); }
.mini-sim .bar { flex: 1; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.act { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.act:hover { color: var(--fg); border-color: var(--muted); }
.act.added { color: var(--good); border-color: rgba(134,207,168,.4); }
.act svg.i { width: 14px; height: 14px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.cmp-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
.cmp th, .cmp td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.cmp tr:last-child td { border-bottom: 0; }
.cmp thead th { vertical-align: bottom; }
.cmp thead .poster { width: 70px; margin-bottom: 8px; }
.cmp th[scope=row] { color: var(--dim); font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; width: 110px; }
.cmp .win { color: var(--accent); font-weight: 600; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.pairs .sim-card { padding: 16px; gap: 12px; border-radius: 14px; }
.verdict { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 0; }
.empty-chat { max-width: 640px; margin: 8vh auto 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
.empty-chat h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
.empty-chat p { color: var(--muted); margin: 0; }
.composer { padding: 10px 16px 16px; }
.composer-in { max-width: 860px; margin: 0 auto; display: grid; gap: 8px; }
.guest { font-size: 12.5px; color: var(--muted); text-align: center; }
.guest button { color: var(--accent); font-weight: 600; font-size: inherit; }
.box { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; }
.box:focus-within { border-color: #4d4057; }
.box textarea { flex: 1; min-width: 0; resize: none; background: none; border: 0; outline: 0; padding: 7px 0; max-height: 140px; font-size: 15px; }
.send { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.send svg.i { stroke-width: 2.2; }
.send:disabled { opacity: .4; cursor: default; }

/* ---------- My List ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 36px 16px 140px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.page-head h1 { font-size: clamp(32px, 4.5vw, 48px); font-weight: 800; }
.page-head p { color: var(--muted); margin: 6px 0 0; max-width: 560px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 18px; }
.tile { display: grid; gap: 9px; text-align: left; position: relative; }
.tile .poster { width: 100%; transition: transform .2s, box-shadow .2s; }
.tile:hover .poster { transform: translateY(-3px); }
.tile.sel .poster { box-shadow: 0 0 0 3px var(--accent), 0 16px 40px -12px rgba(242,161,74,.5); }
.tick { position: absolute; top: 9px; left: 9px; z-index: 2; width: 26px; height: 26px; border-radius: 8px; background: rgba(17,13,19,.7); border: 1.5px solid rgba(255,255,255,.5); display: grid; place-items: center; }
.sel .tick { background: var(--accent); border-color: var(--accent); }
.sel .tick::after { content: ''; width: 10px; height: 5px; border: solid var(--accent-ink); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.tile h3 { font-size: 15.5px; line-height: 1.25; }
.tile-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkish { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linkish:hover { color: var(--fg); }
.actionbar { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 10px 10px 10px 18px; background: var(--panel-2); border: 1px solid #463a4f; border-radius: 999px; box-shadow: 0 24px 60px -10px rgba(0,0,0,.7); width: max-content; max-width: calc(100% - 32px); animation: rise .25s both; }
.actionbar .n { font-size: 13.5px; color: var(--muted); margin-right: 6px; }
.actionbar .n b { color: var(--fg); }
.hint { font-size: 12px; color: var(--dim); }
.state { text-align: center; padding: 70px 16px; display: grid; gap: 14px; justify-items: center; border: 1px dashed var(--line); border-radius: 20px; }
.state h2 { font-size: 26px; }
.state p { color: var(--muted); margin: 0; max-width: 420px; }

/* ---------- Login ---------- */
#v-login { display: grid; grid-template-columns: 1fr 1fr; min-height: 100%; }
.login-art { position: relative; overflow: hidden; background: var(--panel); display: flex; align-items: flex-end; padding: 40px; }
.mosaic { position: absolute; inset: -40px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; transform: rotate(-8deg) scale(1.15); opacity: .5; }
.login-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 8%, transparent 70%); }
.login-art blockquote { position: relative; z-index: 1; margin: 0; font: 700 clamp(22px, 2.6vw, 32px)/1.2 var(--display); max-width: 440px; letter-spacing: -.02em; }
.login-art cite { display: block; font: 400 13px var(--mono); color: var(--muted); margin-top: 12px; font-style: normal; }
.login-form { display: grid; align-content: center; padding: 40px 16px; }
.login-form form { width: 100%; max-width: 380px; margin: 0 auto; display: grid; gap: 16px; }
.login-form h1 { font-size: 34px; font-weight: 800; }
.login-form .sub { color: var(--muted); margin: -6px 0 6px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.field input { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; outline: 0; font-size: 15px; }
.field input:focus { border-color: var(--accent); }
.or { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.err { color: var(--danger); font-size: 13px; margin: 0; }

/* ---------- Modal / Drawer / Toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8,6,10,.66); }
.scrim.enter { animation: fade .3s ease both; }
.scrim.leave { animation: fadeOut .22s ease both; }
@keyframes fadeOut { to { opacity: 0; } }
.modal.enter { animation: pop .24s cubic-bezier(.2,.8,.2,1) both; }
.modal.leave { animation: fadeOut .16s ease both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -47%) scale(.97); } }
@keyframes fade { from { opacity: 0; } }
.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px; display: grid; gap: 12px; text-align: center; justify-items: center; }
.modal .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.modal h2 { font-size: 22px; }
.modal p { color: var(--muted); margin: 0 0 6px; font-size: 14.5px; }
.modal .row { display: flex; gap: 8px; }
.drawer { position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; will-change: transform; box-shadow: -30px 0 80px rgba(0,0,0,.45); }
.drawer.enter { animation: slideIn .42s cubic-bezier(.32,.72,0,1) both; }
.drawer.leave { animation: slideOut .26s cubic-bezier(.4,0,1,1) both; }
@keyframes slideIn { from { transform: translateX(100%); } }
@keyframes slideOut { to { transform: translateX(100%); } }
.d-hero { position: relative; padding: 24px 24px 0; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 20px; align-items: end; }
.d-hero::before { content: ''; position: absolute; inset: 0 0 -40px; background: radial-gradient(ellipse at 20% 0%, hsl(var(--h) 70% 45% / .45), transparent 70%); }
.d-hero > * { position: relative; }
.d-hero .poster { width: 140px; }
.d-hero h2 { font-size: 30px; font-weight: 800; line-height: 1.05; }
.d-close { position: absolute; top: 14px; right: 14px; z-index: 2; background: rgba(17,13,19,.6); }
.d-body { padding: 22px 24px 32px; display: grid; gap: 22px; }
.d-sec { display: grid; gap: 8px; }
.d-sec h4 { margin: 0; font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.d-sec p { margin: 0; color: var(--muted); font-size: 14.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.facts div { background: var(--panel-2); padding: 12px; }
.facts b { display: block; font: 700 20px var(--display); }
.facts span { font-size: 11.5px; color: var(--dim); }
.simlist { display: grid; gap: 8px; }
.simitem { display: grid; grid-template-columns: 36px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding: 6px; border-radius: 10px; text-align: left; }
.simitem:hover { background: var(--panel-2); }
.simitem .poster { width: 36px; border-radius: 4px; }
.simitem .poster * { display: none; }
.simitem b { font: 600 13px var(--mono); color: var(--accent); text-align: right; }
.d-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { position: fixed; z-index: 80; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: rise .25s both; max-width: calc(100% - 32px); }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .feats { grid-template-columns: repeat(2, 1fr); }
  .app, .app.l-off, .app.r-off, .app.l-off.r-off { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 50; top: var(--top); bottom: 0; box-shadow: 0 0 60px rgba(0,0,0,.6); }
  .side-l { left: 0; } .side-r { right: 0; }
  .app.l-off .side-l, .app.r-off .side-r { display: none; }
}
@media (max-width: 860px) {
  .hero-in, .duo { grid-template-columns: 1fr; gap: 40px; }
  .steps-row, .feats { grid-template-columns: 1fr; }
  #v-login { grid-template-columns: 1fr; }
  .login-art { display: none; }
  .nav { margin-left: 0; }
  .user-chip .nm { display: none; }
}
@media (max-width: 520px) {
  .mcard { grid-template-columns: 76px minmax(0, 1fr); }
  .mcard .poster { width: 76px; }
  .d-hero { grid-template-columns: 100px minmax(0, 1fr); }
  .d-hero .poster { width: 100px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .logo span { display: none; }
  .bubble-u, .u-row { max-width: 92%; }
  .actionbar { border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

MOVIES.forEach(m => {
  if (!m.img) return;
  try {
    const bin = atob(m.img.split(',')[1]), buf = new Uint8Array(bin.length);

  } catch { m.img = null; }
});

      <button class="act ${inList ? 'added' : ''}" data-act="add" data-id="${m.id}">${ic(inList ? 'check' : 'plus')}${inList ? 'Đã lưu' : 'My List'}</button>
      <button class="act" data-act="detail" data-id="${m.id}">${ic('info')}Chi tiết</button>
      <button class="act" data-act="similar" data-id="${m.id}">${ic('similar')}Tương tự</button>
    </div>`}
  </div></article>`;
}

function CompareBlock(ids) {
  const ms = ids.map(id => byId[id]);
  const maxR = Math.max(...ms.map(m => m.rating)), minT = Math.min(...ms.map(m => m.runtime));
  const row = (label, f, win) => `<tr><th scope="row">${label}</th>${ms.map(m => `<td class="${win && win(m) ? 'win' : ''}">${f(m)}</td>`).join('')}</tr>`;
  const pairs = [];
  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) pairs.push([ms[i], ms[j]]);
  return `<div class="cmp-wrap"><table class="cmp">
    <thead><tr><th></th>${ms.map(m => `<th>${poster(m)}<div style="font-family:var(--display);font-size:16px">${esc(m.title)}</div></th>`).join('')}</tr></thead>
    <tbody>
      ${row('Năm', m => m.year)}
      ${row('Đạo diễn', m => esc(m.director))}
      ${row('Thời lượng', m => m.runtime + ' phút', m => m.runtime === minT)}
      ${row('Điểm', m => '★ ' + m.rating, m => m.rating === maxR)}
      ${row('Thể loại', m => m.genres.join(', '))}
      ${row('Không khí', m => m.mood)}
      ${row('Chủ đề', m => m.keywords.slice(0, 3).join(', '))}
    </tbody></table></div>
    <div class="pairs">${pairs.map(([a, b]) => `<div class="sim-card">${SimBlock(similarity(a, b), `${a.title} ↔ ${b.title}`)}</div>`).join('')}</div>`;
}

function AiMsg(m) {
  const n = m.done ? m.steps.length : (m.step || 0);
  const steps = `<details class="think" ${m.done ? '' : 'open'}><summary>${ic('spark')} ${m.done ? `Đã suy luận qua ${m.steps.length} bước` : 'Đang suy luận…'}</summary>
    <ol>${m.steps.map((s, i) => `<li class="${i < n ? 'done' : i === n ? 'now' : ''}"><span class="dot"></span>${esc(s)}</li>`).join('')}</ol></details>`;
  if (!m.done) return `<div class="ai"><i class="ai-av"></i><div class="ai-body">${steps}</div></div>`;
  return `<div class="ai"><i class="ai-av"></i><div class="ai-body">${steps}
    <p class="ai-text">${md(m.text)}</p>
    ${m.movies ? `<div class="cards">${m.movies.map(r => MovieCard(r)).join('')}</div>` : ''}
    ${m.compare ? CompareBlock(m.compare) : ''}
    ${m.verdict ? `<p class="verdict">${md(m.verdict)}</p>` : ''}
    ${m.chips && m === conv().msgs.at(-1) ? `<div class="chips">${m.chips.map(c => `<button class="chip" data-act="ask" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
  </div></div>`;
}

/* ================= Actions ================= */
function gate(label, fn) { if (S.user) fn(); else { S.modal = label; S.pending = fn; S.back = S.view; S.anim = true; renderOv(); } }
function newConv() { const c = { id: uid(), title: 'Cuộc trò chuyện mới', msgs: [] }; S.convs.unshift(c); S.cur = c.id; return c; }
function send(inp) {
  if (S.view !== 'app') { S.view = 'app'; try { history.replaceState(null, '', '#app'); } catch {} }
  S.drawer = null;
  if (busy()) return;
  let c = conv(); if (!c) c = newConv();
  if (!c.msgs.length) c.title = labelOf(inp).slice(0, 60);
  S.convs = [c, ...S.convs.filter(x => x !== c)];
  c.msgs.push({ role: 'user', text: labelOf(inp) });
  const ai = { role: 'ai', done: false, step: 0, ...respond(inp) };
  c.msgs.push(ai); S.scroll = true; render();
  const tick = () => {
    ai.step++;
    if (ai.step >= ai.steps.length) { ai.done = true; save(); }
    S.scroll = true; render();
    if (!ai.done) setTimeout(tick, 480);
  };
  setTimeout(tick, 480);
}
function doLogin(name, email) {
  S.user = { name, email };
  if (!S.list.length) S.list = [27205, 666277, 496243, 329865, 313369];
  S.loginErr = ''; S.modal = null; save();
  const p = S.pending; S.pending = null;
  go(S.back === 'login' || S.back === 'landing' ? 'app' : S.back);
  toast(`Xin chào ${name}! My List đã có sẵn vài phim mẫu.`);
  if (p) p();
}
function addToList(id) {
  if (S.list.includes(id)) { S.list = S.list.filter(x => x !== id); toast(`Đã bỏ ${byId[id].title} khỏi My List`); }
  else { S.list = [id, ...S.list]; toast(`Đã thêm ${byId[id].title} vào My List`); }
  save(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = +el.dataset.id;
  switch (a) {
    case 'go': go(el.dataset.v); break;
    case 'gotoList': S.sel = []; go('list'); break;
    case 'login': S.back = S.view === 'login' ? S.back : S.view; S.modal = null; go('login'); break;
    case 'logout': S.user = null; S.sel = []; save(); toast('Đã đăng xuất'); break;
    case 'demo': doLogin('Minh Anh', 'demo@cinemind.vn'); break;
    case 'ask': send({ text: el.dataset.t }); break;
    case 'about': if (innerWidth <= 1080) S.rOff = true; send({ type: 'about', id }); break;
    case 'add': gate('lưu phim vào My List', () => addToList(id)); break;
    case 'detail': gate('xem chi tiết phim', () => openDrawer(id)); break;
    case 'detailNav': S.drawer = id; renderOv(); ovEl.querySelector('.drawer')?.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'similar': gate('tìm phim tương tự', () => send({ type: 'similar', ids: [id] })); break;
    case 'askAbout': send({ type: 'about', id }); break;
    case 'closeModal': closeModal(); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'newchat': S.cur = null; S.editMsg = null; if (innerWidth <= 1080) S.lOff = true; render(); break;
    case 'conv': S.cur = el.dataset.id; S.editMsg = null; if (innerWidth <= 1080) S.lOff = true; S.scroll = true; render(); break;
    case 'renameConv': S.renaming = el.dataset.id; S.deleting = null; S.focusNext = true; render(); break;
    case 'delConv': S.deleting = el.dataset.id; S.renaming = null; render(); break;
    case 'delConvNo': S.deleting = null; render(); break;
    case 'delConvYes': { const cid = el.dataset.id; S.convs = S.convs.filter(x => x.id !== cid); if (S.cur === cid) S.cur = S.convs[0]?.id ?? null; S.deleting = null; save(); toast('Đã xoá cuộc trò chuyện'); break; }
    case 'editMsg': S.editMsg = +el.dataset.i; S.focusNext = true; render(); break;
    case 'editMsgNo': S.editMsg = null; render(); break;
    case 'tab': S.tab = el.dataset.v; render(); break;
    case 'toggleL': S.lOff = !S.lOff; if (innerWidth <= 1080 && !S.lOff) S.rOff = true; render(); break;
    case 'toggleR': S.rOff = !S.rOff; if (innerWidth <= 1080 && !S.rOff) S.lOff = true; render(); break;
    case 'sel': S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id]; render(); break;
    case 'clearSel': S.sel = []; render(); break;
    case 'rmSel': { const n = S.sel.length; S.list = S.list.filter(x => !S.sel.includes(x)); S.sel = []; save(); toast(`Đã bỏ ${n} phim khỏi My List`); break; }
    case 'cmpSel': { const ids = S.sel; S.sel = []; S.cur = null; send({ type: 'compare', ids }); break; }
    case 'simSel': { const ids = S.sel; S.sel = []; S.cur = null; send({ type: 'similar', ids }); break; }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'hero') { const q = document.getElementById('hero-q').value.trim(); S.cur = null; if (q) send({ text: q }); else go('app'); }
  if (f === 'rename') { const v = document.getElementById('rn').value.trim(); const c = S.convs.find(x => x.id === e.target.dataset.id); if (c && v) c.title = v; S.renaming = null; save(); render(); return; }
  if (f === 'editMsg') { const v = document.getElementById('em-t').value.trim(); if (!v) return; conv().msgs.length = +e.target.dataset.i; S.editMsg = null; send({ text: v }); return; }
  if (f === 'chat') { const t = document.getElementById('chat-q'); const q = t.value.trim(); if (q) { t.value = ''; send({ text: q }); } }
  if (f === 'login') {
    const em = document.getElementById('em').value.trim(), pw = document.getElementById('pw').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) S.loginErr = 'Email chưa đúng định dạng, ví dụ ban@email.com.';
    else if (pw.length < 6) S.loginErr = 'Mật khẩu cần tối thiểu 6 ký tự.';
    else return doLogin(em.split('@')[0], em);
    render(); document.getElementById('em').value = em;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'chat-q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
  if (e.key === 'Escape') { if (S.drawer) closeDrawer(); else if (S.modal) closeModal(); else if (S.renaming || S.deleting || S.editMsg != null) { S.renaming = null; S.deleting = null; S.editMsg = null; render(); } }
  if (e.target.id === 'em-t' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener('input', e => { if (e.target.id === 'chat-q') { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; } });

const h0 = location.hash.slice(1);
S.view = ['app', 'list', 'login'].includes(h0) ? h0 : 'landing';
S.scroll = true; render();
</script>
